#app{width:100%;max-width:440px;padding:14px 16px 240px;display:flex;flex-direction:column;align-items:center}

.pill.on{background:var(--y);border-color:var(--y);color:var(--ink);box-shadow:0 3px 0 var(--yedge)}

.meta{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:13px;font-weight:700;color:var(--mut);letter-spacing:.3px}
.streak{color:#e8800c}
.q{text-align:center;margin:12px 0 4px;font-size:15px;font-weight:700;color:var(--mut);letter-spacing:.6px}
.big{display:inline-block;text-align:center;background:var(--y);color:var(--ink);border-radius:16px;padding:12px 22px;font-size:24px;font-weight:800;letter-spacing:.2px;margin:8px 0;box-shadow:0 4px 0 var(--yedge)}
.sub{color:var(--mut);font-size:15px;font-weight:600;line-height:1.4;margin:10px 0 16px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;width:100%}
.grid.shake{animation:shake .45s}
.grid.duo{grid-template-columns:1fr 1fr;gap:14px 18px}
.duo .tile{font-size:60px}
.duo .back b{font-size:26px}
.duo .back small{font-size:12px}
.duo .lab{font-size:15px;min-height:48px}
.lab .dt{display:block;font-size:10px;font-weight:500;opacity:.75;margin-top:2px;line-height:1.1}
.duo .lab .dt{font-size:12px}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;font:inherit;color:inherit;min-width:0;perspective:700px}
.card{position:relative;width:100%;aspect-ratio:1;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.cell.flip .card{transform:rotateY(180deg)}
.tile,.back{position:absolute;inset:0;border-radius:18px;border:3px solid var(--surf);box-shadow:0 0 0 1px var(--line),var(--sh);overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.tile{display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:#fff}
.tile img,.back img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;background:#fff}
.back{transform:rotateY(180deg);background:#18181b;color:#fff;border-color:var(--y);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;gap:2px}
.back img{opacity:.25;filter:grayscale(1)}
.back small,.back b,.back i{position:relative}
.back small{font-size:10px;font-weight:700;color:var(--y);letter-spacing:.8px;text-transform:uppercase}
.back b{font-size:19px;font-weight:800;line-height:1.1;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.back i{position:absolute;top:5px;inset-inline-end:8px;font-style:normal;font-size:14px;color:var(--y)}
.lab{width:100%;min-height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--dark);color:#fff;border-radius:11px;padding:4px 6px;font-size:12px;font-weight:600;line-height:1.15;transition:.15s;overflow-wrap:anywhere}
.lab .ln{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell.out .lab{background:var(--y);color:var(--ink)}
.cell.out.peek .tile{opacity:.75}
.cell.win{animation:hop .6s .1s}
.cell.win .back{border-color:var(--g)}
.cell.win .back small,.cell.win .back i{color:var(--g)}
.cell.win .lab{background:var(--g);color:#06210f}
.cell.bad .back{border-color:var(--r)}
.cell.bad .back small,.cell.bad .back i{color:var(--r)}
.cell.bad .lab{background:var(--r);color:#fff}
.cell:active .card{translate:0 2px}
.bar{display:flex;gap:14px;margin-top:26px}
.btn{border:1.5px solid var(--line);background:var(--surf);color:var(--fg);font:inherit;font-size:17px;font-weight:700;padding:12px 24px;border-radius:999px;box-shadow:0 3px 0 var(--edge);display:flex;gap:8px;align-items:center;justify-content:center}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.y{background:var(--y);border-color:var(--y);color:var(--ink);box-shadow:0 3px 0 var(--yedge)}
.btn.y:active{box-shadow:0 1px 0 var(--yedge)}
#menu{width:100%;display:flex;flex-direction:column;gap:12px;align-items:stretch}
#menu h1{text-align:center;font-size:36px;font-weight:900;margin:22px 0 2px;letter-spacing:.5px;line-height:1}
#menu h1::after{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--y);margin:10px auto 0}
.stats{display:flex;justify-content:center;gap:8px;margin-bottom:6px}
.stat{background:var(--surf);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.cat{background:var(--surf);color:var(--fg);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;font:inherit;font-size:18px;font-weight:800;box-shadow:0 3px 0 var(--edge);text-align:start}
.cat.end{background:var(--inv);color:var(--invfg);border-color:var(--inv);box-shadow:0 3px 0 var(--invedge)}
.cat.end:active{box-shadow:0 1px 0 var(--invedge)}
.cat.end small{color:var(--invmut);opacity:1}
.cat.hero{background:var(--y);border-color:var(--y);color:var(--ink);box-shadow:0 4px 0 var(--yedge);padding:16px 20px 18px;display:flex;flex-direction:column;gap:2px;margin-top:2px}
.cat.hero:active{box-shadow:0 1px 0 var(--yedge)}
.hero .eb{display:block;font-size:12px;font-weight:700;letter-spacing:1px;color:rgba(28,28,28,.65);margin:0}
.hero .ht{font-size:34px;font-weight:900;line-height:1.15}
.hero small{color:rgba(28,28,28,.7)}
.cat.slim{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;font-size:16px}
.slim small{display:block;margin-top:2px}
.slim b{flex:none;font-size:15px}
.seg{display:flex;gap:4px;padding:4px;background:var(--surf2);border:1.5px solid var(--line);border-radius:16px}
.seg button{flex:1;border:0;border-radius:11px;background:none;color:var(--mut);font:inherit;font-size:14px;font-weight:700;padding:9px 2px}
.seg button.on{background:var(--y);color:var(--ink);box-shadow:0 2px 0 var(--yedge)}
.gh{font-size:13px;font-weight:700;color:var(--mut);letter-spacing:1px;margin:14px 4px -2px}
.hubs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat.hub{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 6px 12px;min-height:118px;justify-content:center}
.hub .se{width:48px;height:48px;font-size:24px;border-radius:14px}
.hub .tl{font-size:15px;font-weight:800;line-height:1.15}
.hub small{font-size:11.5px;justify-content:center}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modes .cat{font-size:16px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-height:104px}
.modes .cat small{flex-direction:column;gap:6px}
.cat.grp{min-height:132px}
.subs .cat small{flex-direction:column;gap:2px}
.subs .cat:last-child:nth-child(odd){grid-column:1/-1}
.se{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:13px;background:color-mix(in srgb,var(--y) 22%,transparent)}
.cat.end .se{width:auto;height:auto;background:none}
.grp .se{font-size:26px}
.ghead{display:flex;align-items:center;gap:12px;margin-top:14px}
.ghead h2{margin:0;font-size:24px;font-weight:800}
.ghead .pill{flex:none;font-size:22px}
.dgh{margin:16px 2px 0;font-size:15px;font-weight:800}
.subs.dsubs{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dsubs .cat.sc{font-size:clamp(11px,3.4vw,14px);font-weight:700;overflow-wrap:break-word;padding:10px 8px;line-height:1.2;border-radius:15px;min-height:0;justify-content:flex-start}
.subs.dsubs .cat:last-child:nth-child(odd){grid-column:auto}
.dsubs .sc .se{display:flex;font-size:20px;width:36px;height:36px;border-radius:11px;margin-bottom:6px}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat.sc{font-size:15px;padding:12px 14px 14px;display:flex;flex-direction:column;justify-content:space-between;min-height:118px}
.sc .se{font-size:24px;margin-bottom:8px}
.cat small{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--mut);margin-top:4px;line-height:1.35}
.plist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;width:100%}
.plist span{background:var(--surf);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .now{background:var(--y);border-color:var(--y);color:var(--ink)}
.plist .ko{opacity:.4;text-decoration:line-through}
.plyrs{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.prow{display:flex;gap:8px;align-items:center}
.pin{flex:1;min-width:0;width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--surf);color:var(--fg);font:inherit;font-size:16px;font-weight:600;padding:11px 14px;box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
.pin::placeholder{color:var(--mut);font-weight:500}
.pin:focus{border-color:var(--y);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--y) 35%,transparent)}
.plyrs .btn{align-self:center;font-size:15px;padding:9px 20px}
.chv{text-align:center}
.chv .big{display:block;font-size:22px}
.chv .btn{margin:6px auto 0}
.pb{height:6px;border-radius:3px;background:var(--surf2);margin-top:10px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--y);border-radius:3px}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:520px;margin:0 auto;padding:24px 18px calc(16px + env(safe-area-inset-bottom,0px));background:var(--surf);border-radius:26px 26px 0 0;box-shadow:0 -1px 0 var(--line),0 -14px 40px rgba(0,0,0,.18);text-align:center;transform:translateY(110%);visibility:hidden;transition:transform .3s cubic-bezier(.2,1.3,.5,1),visibility 0s .3s;font-size:20px;font-weight:800}
#sheet::before{content:"";position:absolute;top:9px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--line)}
#sheet.show{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,1.3,.5,1)}
#sheet p{margin:4px 0 14px;font-size:14px;font-weight:600;line-height:1.4;color:var(--mut)}
#sheet .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#sheet .btn{font-size:16px;padding:10px 22px}
#sheet p:empty{display:none}
.float{position:fixed;z-index:6;pointer-events:none;font-size:22px;font-weight:800;color:#d9a800;text-shadow:0 2px 0 var(--bg);animation:rise 1.1s forwards}
#fx{position:fixed;inset:0;pointer-events:none;z-index:7}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.82)}75%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes hop{0%,100%{transform:none}30%{transform:translateY(-12px) scale(1.06)}60%{transform:translateY(2px)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes bump{0%,100%{transform:none}40%{transform:scale(1.18)}}
@keyframes rise{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-50px)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#menu>*{animation:fade .25s ease-out both}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>

<script>
