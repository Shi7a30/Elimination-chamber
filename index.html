<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelhom!</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shelhom">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Baloo+Bhaijaan+2:wght@800&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Design tokens. Light theme first, dark below. --y is the brand yellow; --ink is the near-black used for the question card and flipped cards.
   Spacing follows a 4/8px grid; radii come in three sizes (--r1 small, --r2 cards, --r3 big panels). */
:root{--bg:#f6f5f1;--surf:#fff;--surf2:#efede6;--fg:#16161a;--mut:#6c6a64;--line:#e5e2d9;--edge:#d9d5ca;
 --y:#f7c83d;--y2:#ffdc66;--yedge:#d4a21c;--ink:#16161a;--inkfg:#fff;--inkmut:rgba(255,255,255,.62);--qbg:#16161a;
 --g:#1fa95a;--g2:#29c46c;--r:#e5484d;--o:#f0801a;
 --sh1:0 1px 2px rgba(22,22,26,.05),0 3px 10px -3px rgba(22,22,26,.10);--sh2:0 2px 6px rgba(22,22,26,.06),0 16px 34px -12px rgba(22,22,26,.22);
 --r1:12px;--r2:18px;--r3:24px;
 --glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.74);--glasshi:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.55);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e11;--surf:#19191e;--surf2:#232329;--fg:#f3f3f5;--mut:#9e9ea8;--line:#2a2a31;--edge:#060608;--qbg:#1f1f25;
 --sh1:0 1px 2px rgba(0,0,0,.5),0 3px 10px -3px rgba(0,0,0,.45);--sh2:0 2px 6px rgba(0,0,0,.4),0 16px 34px -12px rgba(0,0,0,.7);
 --glass:rgba(38,38,44,.55);--glass2:rgba(28,28,34,.74);--glasshi:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.07)}}
:root[data-theme="dark"]{--bg:#0e0e11;--surf:#19191e;--surf2:#232329;--fg:#f3f3f5;--mut:#9e9ea8;--line:#2a2a31;--edge:#060608;--qbg:#1f1f25;
 --sh1:0 1px 2px rgba(0,0,0,.5),0 3px 10px -3px rgba(0,0,0,.45);--sh2:0 2px 6px rgba(0,0,0,.4),0 16px 34px -12px rgba(0,0,0,.7);
 --glass:rgba(38,38,44,.55);--glass2:rgba(28,28,34,.74);--glasshi:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;display:flex;justify-content:center;overflow-x:hidden;-webkit-font-smoothing:antialiased}
html[lang=ar] body{font-family:"Cairo","Rubik",system-ui,-apple-system,"Segoe UI",sans-serif}
button{cursor:pointer;font:inherit;color:inherit;transition:transform .14s cubic-bezier(.3,.7,.4,1),box-shadow .14s,background-color .2s,color .2s,opacity .2s}
button:focus-visible,.pin:focus-visible{outline:3px solid var(--y);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
html[dir=rtl] .flipx{transform:scaleX(-1)}
#app{width:100%;max-width:440px;padding:12px 16px 240px;display:flex;flex-direction:column;align-items:center}

/* --- top bar: back/home on the start side, a grouped tool capsule, coins on the end side --- */
.top{width:100%;display:flex;align-items:center;gap:8px;min-height:48px}
.top .gap{flex:1}
.pill{border:0;border-radius:999px;background:var(--surf);color:var(--fg);font-weight:700;font-size:16px;min-width:44px;height:44px;padding:0 12px;box-shadow:var(--sh1);display:flex;align-items:center;justify-content:center;gap:7px}
.pill svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill:active{transform:scale(.94)}
.pill.on{background:var(--y);color:var(--ink)}
.pill.bump{animation:bump .45s}
.tools{display:flex;align-items:center;background:var(--surf);border-radius:999px;box-shadow:var(--sh1);padding:2px}
.tools .pill{box-shadow:none;background:none;min-width:40px;width:40px;height:40px;padding:0;color:var(--mut)}
.tools .pill.on{background:var(--y);color:var(--ink)}
#lang{font-size:16px;font-weight:800}
html[lang=ar] #lang{font-family:"Rubik",sans-serif;font-size:14px}
#cpill{font-variant-numeric:tabular-nums;font-weight:700;padding:0 8px 0 14px;gap:6px}
body[data-scr=home] #home{display:none}
body:not([data-scr=game]) #cam{display:none}
/* The coin is the Egyptian 1-pound coin: silver ring, gold middle with Tutankhamun's mask. */
.coin{width:22px;height:22px;border-radius:50%;background:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGRlZnM+PHJhZGlhbEdyYWRpZW50IGlkPSJnIiBjeD0iLjM1IiBjeT0iLjMiIHI9Ii44Ij48c3RvcCBvZmZzZXQ9IjAiIHN0b3AtY29sb3I9IiNmZmU5YTMiLz48c3RvcCBvZmZzZXQ9Ii41NSIgc3RvcC1jb2xvcj0iI2U4YjkyMyIvPjxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iI2I4ODcwZiIvPjwvcmFkaWFsR3JhZGllbnQ+PHJhZGlhbEdyYWRpZW50IGlkPSJzIiBjeD0iLjM1IiBjeT0iLjMiIHI9Ii44Ij48c3RvcCBvZmZzZXQ9IjAiIHN0b3AtY29sb3I9IiNmZmYiLz48c3RvcCBvZmZzZXQ9Ii42IiBzdG9wLWNvbG9yPSIjZDNkOGRjIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjOTU5ZGE0Ii8+PC9yYWRpYWxHcmFkaWVudD48Y2xpcFBhdGggaWQ9ImMiPjxjaXJjbGUgY3g9IjMyIiBjeT0iMzIiIHI9IjIwIi8+PC9jbGlwUGF0aD48L2RlZnM+PGNpcmNsZSBjeD0iMzIiIGN5PSIzMiIgcj0iMzEiIGZpbGw9InVybCgjcykiIHN0cm9rZT0iIzdkODU4YyIgc3Ryb2tlLXdpZHRoPSIyIi8+PGNpcmNsZSBjeD0iMzIiIGN5PSIzMiIgcj0iMjAuNSIgZmlsbD0idXJsKCNnKSIgc3Ryb2tlPSIjOWM3MjBhIiBzdHJva2Utd2lkdGg9IjEuNSIvPjxnIGNsaXAtcGF0aD0idXJsKCNjKSI+PHBhdGggZD0iTTMyIDE2Yy02IDAtOS41IDMuNS0xMCA4bC01IDEwIDUgMnYxNmgyMFYzNmw1LTItNS0xMGMtLjUtNC41LTQtOC0xMC04eiIgZmlsbD0iI2I5OGExMiIvPjxwYXRoIGQ9Ik0yMi41IDI1LjVoMTlNMjAuNSAyOS41aDIzTTE4LjggMzMuNWgyNi40TTIyIDM4aDMuNU0zOC41IDM4aDMuNU0yMiA0MmgzLjVNMzguNSA0MmgzLjVNMjIgNDZoMy41TTM4LjUgNDZoMy41IiBzdHJva2U9IiNmMmNmNWMiIHN0cm9rZS13aWR0aD0iMS42Ii8+PHBhdGggZD0iTTI2IDI3LjVjMC0zIDIuNi00LjUgNi00LjVzNiAxLjUgNiA0LjV2OGMwIDQtMi42IDYuNS02IDYuNXMtNi0yLjUtNi02LjV6IiBmaWxsPSIjZmZlN2EwIiBzdHJva2U9IiM4YTY0MDgiIHN0cm9rZS13aWR0aD0iMSIvPjxwYXRoIGQ9Ik0yOC40IDMwLjZoMi40TTMzLjIgMzAuNmgyLjQiIHN0cm9rZT0iIzVjNDMwNSIgc3Ryb2tlLXdpZHRoPSIxLjMiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjxwYXRoIGQ9Ik0zMiAzMS41djMuMiIgc3Ryb2tlPSIjYzk5YTFjIiBzdHJva2Utd2lkdGg9IjEiLz48cGF0aCBkPSJNMzAuMiA0MmgzLjZsLS42IDdoLTIuNHoiIGZpbGw9IiM4YTY0MDgiLz48Y2lyY2xlIGN4PSIzMiIgY3k9IjE5LjgiIHI9IjEuNiIgZmlsbD0iIzhhNjQwOCIvPjwvZz48L3N2Zz4=") center/contain no-repeat;display:inline-block;flex:none;vertical-align:-5px}
.btn .coin{width:18px;height:18px}

/* --- "new version" banner: shows when an update has been installed in the background --- */
#upd{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:9;display:flex;align-items:center;gap:12px;
 max-width:calc(100% - 32px);padding:8px 8px 8px 16px;border-radius:999px;background:var(--ink);color:var(--inkfg);box-shadow:var(--sh2);font-size:15px;font-weight:600;
 transition:transform .35s cubic-bezier(.3,.7,.4,1);white-space:nowrap}
#upd.show{transform:translate(-50%,0)}
#upd button{border:0;border-radius:999px;background:var(--y);color:var(--ink);font-weight:800;font-size:15px;padding:8px 16px;min-height:36px}
html[dir=rtl] #upd{padding:8px 16px 8px 8px}

/* --- shared text --- */
.sub{color:var(--mut);font-size:14px;font-weight:500;line-height:1.45;margin:10px 0 16px;text-align:center}
.big{display:inline-block;text-align:center;background:var(--y);color:var(--ink);border-radius:var(--r2);padding:12px 22px;font-size:22px;font-weight:800;margin:8px 0}

/* --- home --- */
#menu{width:100%;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.brand{display:flex;align-items:center;gap:14px;margin:14px 2px 6px}
.brand img{width:60px;height:60px;border-radius:16px;box-shadow:var(--sh2);flex:none}
.brand h1{margin:0;font-family:"Baloo Bhaijaan 2","Rubik",sans-serif;font-size:32px;font-weight:800;line-height:1.05;letter-spacing:-.2px}
.brand p{margin:3px 0 0;font-size:13.5px;color:var(--mut);font-weight:500}
.stats{display:grid;grid-template-columns:1fr 1fr;background:var(--surf);border-radius:var(--r2);box-shadow:var(--sh1);padding:12px 0}
.stats>div{display:flex;flex-direction:column;align-items:center;gap:1px}
.stats>div+div{border-inline-start:1px solid var(--line)}
.stats b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.stats b svg{width:20px;height:20px}
.stats .fl{color:var(--o)}.stats .md{color:#d9a20f}
.stats small{font-size:12px;color:var(--mut);font-weight:500}
.seg{display:flex;gap:2px;padding:3px;background:var(--surf2);border-radius:14px}
.seg button{flex:1;border:0;border-radius:11px;background:none;color:var(--mut);font-size:14px;font-weight:600;padding:8px 2px}
.seg button.on{background:var(--surf);color:var(--fg);box-shadow:var(--sh1)}
html[data-theme=dark] .seg button.on{background:#34343c}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .seg button.on{background:#34343c}}
.cat{position:relative;background:var(--surf);color:var(--fg);border:0;border-radius:var(--r2);padding:14px 16px;font-size:17px;font-weight:700;box-shadow:var(--sh1);text-align:start}
.cat:active{transform:scale(.97)}
.cat small{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;font-weight:500;color:var(--mut);margin-top:3px;line-height:1.35}
/* the big Play card: yellow, with a little 3x3 board where the claw has pulled one card out */
.cat.hero{background:linear-gradient(135deg,var(--y2),var(--y) 55%,#f2b928);color:var(--ink);padding:18px 20px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:164px;overflow:hidden;
 box-shadow:0 5px 0 var(--yedge),0 18px 30px -14px rgba(180,130,0,.55);margin-bottom:4px}
.cat.hero:active{transform:translateY(3px);box-shadow:0 2px 0 var(--yedge),0 10px 20px -12px rgba(180,130,0,.5)}
.hero .eb{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;background:rgba(22,22,26,.1);color:var(--ink);padding:4px 10px;border-radius:999px;margin:0}
.hero .ht{position:relative;z-index:1;display:flex;align-items:center;gap:10px;font-size:clamp(28px,9.5vw,38px);font-weight:800;line-height:1.1;margin-top:6px}
.hero .ht i{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--y)}
.hero .ht i svg{width:18px;height:18px;fill:currentColor;stroke:none;margin-inline-start:3px}
html[dir=rtl] .hero .ht i svg{transform:scaleX(-1);margin:0 0 0 3px}
.hero small{display:block;color:rgba(22,22,26,.72);max-width:58%;margin-top:auto}
.hero .hb{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.45);padding:4px 10px;border-radius:999px}
.hgrid{position:absolute;inset-inline-end:16px;top:50%;display:grid;grid-template-columns:repeat(3,24px);gap:6px;transform:translateY(-38%) rotate(-8deg);pointer-events:none}
.hgrid i{width:24px;height:24px;border-radius:7px;background:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.hgrid i:nth-child(2){background:rgba(22,22,26,.16);box-shadow:none}
.hgrid b{position:absolute;left:50%;top:-30px;width:30px;height:30px;margin-left:-15px;border-radius:8px;background:var(--surf);border:3px solid var(--ink);transform:rotate(14deg);animation:lift 2.6s ease-in-out infinite}
.hgrid b::before{content:"";position:absolute;left:50%;bottom:100%;width:3px;height:40px;margin-left:-1.5px;background:var(--ink)}
html[dir=rtl] .hgrid{transform:translateY(-38%) rotate(8deg)}
/* small phones: a smaller board so it never covers the Play title */
@media (max-width:360px){.hgrid{grid-template-columns:repeat(3,19px);gap:5px;inset-inline-end:12px}.hgrid i{width:19px;height:19px;border-radius:6px}.hgrid b{width:24px;height:24px;margin-left:-12px;top:-26px}}
.hubs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cat.hub{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 12px 13px;min-height:122px}
.hub .se{margin-bottom:auto}
.hub .tl{max-width:100%;overflow-wrap:anywhere;font-size:clamp(13px,4.1vw,15px);font-weight:700;line-height:1.2;margin-top:10px}
.hub small{font-size:12px;margin-top:1px}
.se{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;font-size:22px;line-height:1;flex:none;background:color-mix(in srgb,var(--c,var(--y)) 20%,transparent)}
.se.k{background:var(--ink);color:var(--y)}
html[data-theme=dark] .se.k{background:#2c2c33}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .se.k{background:#2c2c33}}
.se svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--surf2);border-radius:var(--r2);padding:12px 14px;margin-top:4px;font-size:13px;line-height:1.45;color:var(--mut)}
.tip svg{width:18px;height:18px;flex:none;margin-top:1px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.offl{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;margin-top:8px;border:0;background:none;color:var(--mut);font-size:13px;font-weight:600;padding:10px 12px;border-radius:var(--r1);min-height:44px}
.offl:not(:disabled):active{transform:scale(.97)}
.offl:disabled{cursor:default}
.offl svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* --- category and mode pages --- */
.ghead{display:flex;align-items:center;gap:12px;margin:10px 0 2px}
.ghead h2{margin:0;font-size:24px;font-weight:800;line-height:1.25;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.ghead .pill{flex:none}
.dgh{margin:14px 2px -2px;font-size:13px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:6px}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat.sc{font-size:15.5px;padding:14px 14px 14px;display:flex;flex-direction:column;justify-content:space-between;min-height:132px;line-height:1.2}
.sc .se{margin-bottom:12px}
.cat.grp{min-height:146px}
.subs .cat:last-child:nth-child(odd){grid-column:1/-1}
.subs.dsubs{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dsubs .cat.sc{font-size:clamp(11.5px,3.4vw,13.5px);font-weight:600;overflow-wrap:break-word;padding:12px 10px;border-radius:16px;min-height:0;justify-content:flex-start}
.subs.dsubs .cat:last-child:nth-child(odd){grid-column:auto}
.dsubs .sc .se{width:36px;height:36px;font-size:19px;border-radius:11px;margin-bottom:8px}
.subs .cat small{flex-direction:column;gap:1px}
.pb{height:6px;border-radius:3px;background:var(--surf2);margin-top:10px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--c,var(--y));border-radius:3px}
.cat.end{background:var(--ink);color:var(--inkfg);display:flex;align-items:center;gap:14px}
.cat.end small{color:var(--inkmut)}
.cat.end .se{background:rgba(255,255,255,.1);color:var(--y)}
html[data-theme=dark] .cat.end{background:#26262d}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .cat.end{background:#26262d}}
.cat.end>span:not(.se){flex:1;display:flex;flex-direction:column}
.subs>.cat.end{grid-column:1/-1}
.modes{display:flex;flex-direction:column;gap:12px}
.cat.row{display:flex;align-items:center;gap:14px;padding:16px}
.cat.row>span:not(.se){flex:1;display:flex;flex-direction:column;font-size:17px}
.cat.row .chev{color:var(--mut);width:20px;height:20px;flex:none}

/* --- player list, inputs --- */
.plist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;width:100%}
.plist span{background:var(--surf);box-shadow:var(--sh1);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .now{background:var(--y);color:var(--ink)}
.plist .ko{opacity:.4;text-decoration:line-through;box-shadow:none}
.plyrs{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.prow{display:flex;gap:8px;align-items:center}
.pin{flex:1;min-width:0;width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--surf);color:var(--fg);font:inherit;font-size:16px;font-weight:500;padding:12px 14px}
.pin::placeholder{color:var(--mut)}
.pin:focus{border-color:var(--y);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--y) 30%,transparent)}
.plyrs .btn{align-self:center;font-size:15px;padding:10px 20px}
.chv{text-align:center}
.chv .big{display:block;font-size:22px}
.chv .btn{margin:6px auto 0}

/* --- game screen --- */
#game{animation:enter .3s ease-out both}
.meta{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;font-weight:600;color:var(--mut)}
.meta span:empty{display:none}
.streak{color:var(--o)}
.meta .streak{background:color-mix(in srgb,var(--o) 14%,transparent);padding:3px 10px;border-radius:999px;font-weight:700}
/* the question sits on one dark card: small lead-in, the key words in big yellow, small tail */
.qcard{position:relative;width:100%;margin-top:10px;background:var(--qbg);color:var(--inkfg);border-radius:var(--r3);padding:16px 18px 18px;text-align:center;overflow:hidden;box-shadow:var(--sh2)}
html[data-theme=dark] .qcard{box-shadow:inset 0 0 0 1px var(--line),var(--sh2)}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .qcard{box-shadow:inset 0 0 0 1px var(--line),var(--sh2)}}
.qcard::before{content:"";position:absolute;inset:-40% -20% auto;height:120%;background:radial-gradient(closest-side,rgba(247,200,61,.16),transparent);pointer-events:none}
.qcard .q{position:relative;margin:0;font-size:13.5px;font-weight:500;color:var(--inkmut)}
.qcard .q:empty{display:none}
.qcard .big{position:relative;display:block;background:none;color:var(--y);padding:0;margin:4px 0;font-size:26px;font-weight:800;line-height:1.18;letter-spacing:-.2px;border-radius:0}
.q{text-align:center;color:var(--mut)}
#sub{display:inline-flex;align-items:center;gap:6px;margin:14px 0 14px;padding:6px 14px;border-radius:999px;background:var(--surf);box-shadow:var(--sh1);font-size:13.5px;font-weight:600;color:var(--fg)}
#sub:empty{display:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;width:100%}
.grid.shake{animation:shake .45s}
.grid.duo{grid-template-columns:1fr 1fr;gap:14px 16px}
.duo .tile{font-size:60px}
.duo .back b{font-size:26px}
.duo .back small{font-size:12px}
.duo .lab{font-size:15px;min-height:44px}
.lab .dt{display:block;font-size:10px;font-weight:500;color:var(--mut);margin-top:1px;line-height:1.15}
.duo .lab .dt{font-size:12px}
.cell{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;padding:0;min-width:0;perspective:700px}
.grid.deal .cell{animation:deal .42s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i,0)*40ms)}
.card{position:relative;width:100%;aspect-ratio:1;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.cell.flip .card{transform:rotateY(180deg)}
.tile,.back{position:absolute;inset:0;border-radius:16px;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:var(--sh1)}
.tile::after,.back::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);pointer-events:none}
.tile{display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.18)}
.tile img,.back img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;background:#fff}
.back{transform:rotateY(180deg);background:#1b1b20;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;gap:2px}
.back img{opacity:.22;filter:grayscale(1)}
.back small,.back b,.back i{position:relative}
.back small{font-size:9.5px;font-weight:600;color:var(--y);letter-spacing:.4px;text-transform:uppercase;opacity:.95}
.back b{font-size:19px;font-weight:800;line-height:1.1;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.back i{position:absolute;top:6px;inset-inline-end:6px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:800;background:rgba(255,255,255,.14);color:#fff}
.lab{width:100%;min-height:30px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;color:var(--fg);padding:0 2px;font-size:12.5px;font-weight:600;line-height:1.2;overflow-wrap:anywhere;transition:color .2s}
.lab .ln{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell.out .lab{color:var(--mut)}
.cell.out.peek .tile{opacity:.55;filter:grayscale(.7)}
.cell.win{animation:hop .6s .1s}
.cell.win .back{background:linear-gradient(160deg,var(--g2),var(--g))}
.cell.win .back img{opacity:.18}
.cell.win .back small{color:#eafff1}
.cell.win .back i{background:#fff;color:var(--g)}
.cell.win .back{box-shadow:0 10px 22px -6px rgba(31,169,90,.55)}
.cell.win .lab{color:var(--g);font-weight:700}
.cell.bad .back{background:linear-gradient(160deg,#f2676b,var(--r))}
.cell.bad .back small{color:#fff}
.cell.bad .back i{background:#fff;color:var(--r)}
.cell.bad .lab{color:var(--r);font-weight:700}
.cell:active .card{scale:.96}
.bar{display:flex;gap:12px;margin-top:24px}
.bar .btn:empty{display:none}
.btn{border:0;background:var(--surf);color:var(--fg);font-size:16px;font-weight:700;padding:13px 24px;border-radius:16px;box-shadow:0 0 0 1.5px var(--line) inset,0 3px 0 var(--edge);display:flex;gap:8px;align-items:center;justify-content:center;min-height:50px}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 1.5px var(--line) inset,0 1px 0 var(--edge)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.y{background:var(--y);color:var(--ink);box-shadow:0 4px 0 var(--yedge)}
.btn.y:active{box-shadow:0 1px 0 var(--yedge);transform:translateY(3px)}

/* --- result popup (bottom sheet) --- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:480px;margin:0 auto;padding:22px 20px calc(18px + env(safe-area-inset-bottom,0px));background:var(--surf);border-radius:28px 28px 0 0;box-shadow:0 -18px 50px rgba(0,0,0,.22);text-align:center;transform:translateY(110%);visibility:hidden;transition:transform .34s cubic-bezier(.2,1.25,.45,1),visibility 0s .34s;font-size:22px;font-weight:800}
#sheet::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
#sheet.show{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,1.25,.45,1)}
#sbadge{width:64px;height:64px;margin:4px auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;background:color-mix(in srgb,var(--y) 26%,transparent)}
#sbadge:empty{display:none}
#sheet.good #sbadge{background:color-mix(in srgb,var(--g) 18%,transparent)}
#sheet.bad #sbadge{background:color-mix(in srgb,var(--r) 15%,transparent)}
#sheet.show #sbadge{animation:pop .5s .1s both}
#st{letter-spacing:-.2px}
#sheet.good #st{color:var(--g)}
#sheet.bad #st{color:var(--r)}
#sheet p{margin:6px auto 18px;max-width:360px;font-size:14.5px;font-weight:500;line-height:1.45;color:var(--mut)}
#sheet p:empty{display:none}
#sheet .row{display:flex;gap:10px;justify-content:center}
#sheet .btn{flex:1;max-width:240px;font-size:16px;padding:12px 14px}
.float{position:fixed;z-index:6;pointer-events:none;font-size:20px;font-weight:800;color:#d9a800;text-shadow:0 2px 0 var(--bg);animation:rise 1.1s forwards}
#fx{position:fixed;inset:0;pointer-events:none;z-index:7}

/* --- liquid glass: the floating top bar and the popup are frosted, so the game shows through blurred.
   Solid fallback where blur isn't supported, when the phone asks for less transparency, or on low-end phones (.noglass). --- */
.top{position:sticky;top:0;z-index:4;padding:8px 0 14px;margin:-8px 0 -6px}
/* content scrolling under the bar fades out, so text never shows through the gaps between the buttons */
.top::before{content:"";position:absolute;inset:0 -16px;z-index:-1;pointer-events:none;background:linear-gradient(var(--bg) 35%,color-mix(in srgb,var(--bg) 60%,transparent) 70%,transparent)}
.tools,.top>.pill{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);box-shadow:var(--glasshi),0 8px 24px -10px rgba(0,0,0,.3)}
.tools .pill{background:none;box-shadow:none}
.tools .pill.on{background:var(--y)}
#sheet{background:var(--glass2);-webkit-backdrop-filter:blur(28px) saturate(1.8);backdrop-filter:blur(28px) saturate(1.8);box-shadow:var(--glasshi),0 -18px 50px rgba(0,0,0,.22)}
#sheet p{color:var(--fg);opacity:.72}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.tools,.top>.pill,#sheet{background:var(--surf)}}
@media (prefers-reduced-transparency:reduce){.tools,.top>.pill,#sheet{background:var(--surf);-webkit-backdrop-filter:none;backdrop-filter:none}}
html.noglass .tools,html.noglass .top>.pill,html.noglass #sheet{background:var(--surf);-webkit-backdrop-filter:none;backdrop-filter:none}

/* --- motion --- */
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes hop{0%,100%{transform:none}30%{transform:translateY(-12px) scale(1.06)}60%{transform:translateY(2px)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

@keyframes rise{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-50px)}}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes deal{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes lift{0%,100%{transform:translateY(0) rotate(14deg)}50%{transform:translateY(-5px) rotate(8deg)}}
#menu>*{animation:enter .32s cubic-bezier(.2,.8,.3,1) both}
#menu>:nth-child(2){animation-delay:.03s}#menu>:nth-child(3){animation-delay:.06s}#menu>:nth-child(4){animation-delay:.09s}#menu>:nth-child(5){animation-delay:.12s}#menu>:nth-child(n+6){animation-delay:.15s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
