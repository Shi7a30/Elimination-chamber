.top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:7px}
.top .gap{flex:1}
.pill{border:3px solid var(--fg);border-radius:16px;background:var(--bg);color:var(--fg);font:inherit;font-size:19px;min-width:46px;height:46px;padding:0 11px;box-shadow:0 5px 0 var(--fg);display:flex;align-items:center;justify-content:center;gap:8px}
.pill:active,.btn:active,.cat:active{transform:translateY(3px);box-shadow:0 2px 0 var(--fg)}
.pill.on{background:var(--y);color:#1c1c1c}
.pill.bump{animation:bump .45s}
#lang{font-size:16px}
.coin{width:20px;height:20px;border-radius:50%;background:var(--y);border:3px solid #d9a800;display:inline-block;flex:none}
.meta{width:100%;display:flex;justify-content:space-between;margin-top:16px;font-size:14px;color:var(--mut)}
.streak{color:#f08c00}
.q{text-align:center;margin:12px 0 6px;font-size:18px}
.big{display:inline-block;text-align:center;background:var(--y);color:#1c1c1c;border:4px solid var(--fg);border-radius:18px;padding:12px 22px;font-size:24px;margin:8px 0}
.sub{color:var(--mut);font-size:16px;margin:10px 0 16px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;width:100%}
.grid.shake{animation:shake .45s}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;font:inherit;color:inherit;min-width:0}
.tile{position:relative;width:100%;aspect-ratio:1;border-radius:20px;border:4px solid var(--dark);box-shadow:0 5px 0 var(--dark);display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;overflow:hidden;transition:.15s}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;background:#fff}
.lab{width:100%;min-height:40px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--dark);color:#fff;border-radius:14px;padding:3px 6px;font-size:12px;line-height:1.15;transition:.15s;overflow-wrap:anywhere}
.cell.out .tile{border-color:var(--y);box-shadow:0 5px 0 var(--y)}
.cell.out .tile>*{opacity:.4}
.cell.out .tile::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:58px;color:var(--y);text-shadow:0 3px 0 #0007}
.cell.out .lab{background:var(--y);color:#1c1c1c;font-size:15px}
.cell.win .tile{border-color:var(--g);box-shadow:0 5px 0 var(--g);animation:hop .6s .1s}
.cell.win .lab{background:var(--g);color:#06210f}
.cell.bad .tile{border-color:var(--r);box-shadow:0 5px 0 var(--r)}
.cell.bad .tile::after{color:var(--r)}
.cell.bad .lab{background:var(--r);color:#fff}
.cell.pop .tile{animation:pop .3s}
.cell:active .tile{transform:translateY(3px)}
.cell.show .lab{font-size:15px}
.bar{display:flex;gap:18px;margin-top:26px}
.btn{border:3px solid var(--fg);background:var(--bg);color:var(--fg);font:inherit;font-size:19px;padding:11px 22px;border-radius:999px;box-shadow:0 5px 0 var(--fg);display:flex;gap:8px;align-items:center;justify-content:center}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.y{background:var(--y);color:#1c1c1c}
#menu{width:100%;display:flex;flex-direction:column;gap:14px;align-items:stretch}
#menu h1{text-align:center;font-size:34px;margin:18px 0 0;letter-spacing:1px}
.stats{display:flex;justify-content:center;gap:10px;margin-bottom:4px}
.stat{border:3px solid var(--fg);border-radius:14px;padding:6px 12px;font-size:14px}
.cat{background:var(--y);color:#1c1c1c;border:4px solid var(--fg);border-radius:20px;padding:14px 16px;font:inherit;font-size:20px;box-shadow:0 5px 0 var(--fg);text-align:start}
.cat small{display:flex;justify-content:space-between;font-size:13px;opacity:.75;margin-top:4px}
.pb{height:8px;border-radius:4px;background:#1c1c1c26;margin-top:8px;overflow:hidden}
.pb i{display:block;height:100%;background:#1c1c1c;border-radius:4px}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:4px solid var(--fg);border-radius:26px 26px 0 0;text-align:center;transform:translateY(110%);visibility:hidden;transition:transform .3s cubic-bezier(.2,1.3,.5,1),visibility 0s .3s;font-size:24px}
#sheet.show{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,1.3,.5,1)}
#sheet p{margin:6px 0 16px;font-size:16px;color:var(--mut)}
#sheet .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.float{position:fixed;z-index:6;pointer-events:none;font-size:22px;color:#d9a800;text-shadow:0 2px 0 var(--bg);animation:rise 1.1s forwards}
#fx{position:fixed;inset:0;pointer-events:none;z-index:7}

var START=50,UNDO=30,WIN=10;

var ci=0,ri=0,items,out,hist,over,corr,last,lostStreak,runOk,edit=false,pend=null,stT;
function ld(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
coins=ld("elim_coins",START);if(typeof coins!=="number"||!(coins>=0))coins=START;
streak=ld("elim_streak",0)|0;best=ld("elim_best",0)|0;prog=ld("elim_prog",{})||{};mute=!!ld("elim_mute",false);
IM=ld("elim_img",{})||{};WK=ld("elim_wiki",{})||{};L=ld("elim_lang","en")==="ar"?"ar":"en";
function save(){sv("elim_coins",coins);sv("elim_streak",streak);sv("elim_best",best);sv("elim_prog",prog);sv("elim_mute",mute);sv("elim_lang",L)}
function t(k){return TX[L][k]}
function n(v,dp){return L==="ar"?v.toLocaleString("ar-EG",{useGrouping:v>=10000,minimumFractionDigits:dp||0,maximumFractionDigits:dp==null?2:dp}):dp!=null?v.toFixed(dp):v>=10000?v.toLocaleString("en-US"):String(v)}
function li(p){return p?p[L==="ar"?1:0]:""}
function fmt(r,v){return li(r.pre)+n(v,r.dp)+li(r.suf)}
function nm(it){return L==="ar"&&it[2]?it[2]:it[0]}
function cname(c){return L==="ar"?c.a:c.n.toUpperCase()}
function key(c,r){return c.n+"|"+r.q[1]}
function solved(c){return c.r.filter(function(r){return prog[key(c,r)]}).length}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(ch){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]})}

// --- Wikipedia photos: looked up on the device at play time, cached by name ---
function wapi(p){return fetch("https://en.wikipedia.org/w/api.php?origin=*&format=json&formatversion=2&"+p).then(function(r){return r.json()})}
var PI="prop=pageimages|pageprops&ppprop=disambiguation&piprop=thumbnail&pithumbsize=400&pilicense=any";
function gotPhoto(name,url){WK[name]=url;sv("elim_wiki",WK);
 if($("game").style.display==="none")return;
 [].forEach.call(document.querySelectorAll(".cell"),function(c){var it=items[+c.dataset.i];if(it[0]===name&&!IM[name])setImg(c.querySelector(".tile"),url)})}
function setImg(tile,url){var o=tile.querySelector("img");if(o)o.remove();var im=new Image();im.alt="";im.onerror=function(){im.remove()};im.src=url;tile.appendChild(im)}
function okPage(p){return p&&!p.missing&&p.thumbnail&&!(p.pageprops&&"disambiguation" in p.pageprops)}
function loadPhotos(c){var need=[],seen={};
 c.r.forEach(function(r){r.items.forEach(function(it){if(!WK[it[0]]&&!seen[it[0]]){seen[it[0]]=1;need.push({it:it,h:r.h})}})});
 if(!need.length||typeof fetch!=="function")return;
 wapi("action=query&redirects=1&"+PI+"&titles="+encodeURIComponent(need.map(function(x){return x.it[3]||x.it[0]}).join("|"))).then(function(d){
  var q=d.query||{},map={},pg={};
  (q.normalized||[]).concat(q.redirects||[]).forEach(function(x){map[x.from]=x.to});
  (q.pages||[]).forEach(function(p){pg[p.title]=p});
  need.forEach(function(x){var ti=x.it[3]||x.it[0];ti=map[ti]||ti;ti=map[ti]||ti;var p=pg[ti];
   if(okPage(p))gotPhoto(x.it[0],p.thumbnail.source);else searchPhoto(x)})}).catch(function(){})}
function searchPhoto(x){wapi("action=query&generator=search&gsrlimit=1&gsrsearch="+encodeURIComponent(x.it[0].replace(/'/g,"")+" "+x.h)+"&"+PI).then(function(d){
 var p=d.query&&d.query.pages&&d.query.pages[0];if(okPage(p))gotPhoto(x.it[0],p.thumbnail.source)}).catch(function(){})}

var AC;
function tone(f,d,ty,v,w){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
 var o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+(w||0);o.type=ty||"sine";o.frequency.setValueAtTime(f,s);
 g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d+.02)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

 lose:function(){tone(330,.3,"sawtooth",.07);tone(233,.5,"sawtooth",.07,.2);buzz([60,40,90])},

function floatTxt(s){var p=$("cpill").getBoundingClientRect(),e=document.createElement("span");e.className="float";e.textContent=s;
 e.style.left=(p.left+10)+"px";e.style.top=(p.bottom+4)+"px";document.body.appendChild(e);setTimeout(function(){e.remove()},1200)}
function bump(){var p=$("cpill");p.classList.remove("bump");void p.offsetWidth;p.classList.add("bump")}
function shake(){var g=$("grid");g.classList.remove("shake");void g.offsetWidth;g.classList.add("shake")}
function confetti(){if(RM)return;var cv=$("fx"),x=cv.getContext("2d"),W=cv.width=innerWidth,H=cv.height=innerHeight,cols=["#f7c83d","#3ecf6e","#e5484d","#4c8dff","#ff7ac8"],P=[],t0=performance.now();
 for(var i=0;i<140;i++)P.push({x:W/2,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,s:6+Math.random()*6,c:cols[i%5]});
 (function f(tm){x.clearRect(0,0,W,H);var k=(tm-t0)/1800;if(k>1)return;P.forEach(function(p){p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
  x.save();x.globalAlpha=1-k;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});requestAnimationFrame(f)})(t0)}

// --- screens ---
function applyLang(){var h=document.documentElement;h.lang=L;h.dir=L==="ar"?"rtl":"ltr";$("lang").textContent=t("lang");$("snd").textContent=mute?"🔇":"🔊"}
function inGame(){return $("game").style.display!=="none"}
function menu(){hide();edit=false;$("game").style.display="none";$("menu").style.display="flex";$("coins").textContent=n(coins);$("cam").className="pill";
 $("menu").innerHTML="<h1>"+t("title")+"</h1><div class='stats'><span class='stat streak'>"+t("streak")+n(streak)+"</span><span class='stat'>"+t("best")+n(best)+"</span></div>"+
  CATS.map(function(c,i){var s=solved(c),k=c.r.length;return '<button class="cat" data-c="'+i+'">'+c.e+" "+cname(c)+
   "<small><span>"+t("rounds")(n(k))+"</span><span>"+(s===k?t("complete"):t("solved")(n(s),n(k)))+'</span></small><div class="pb"><i style="width:'+(s/k*100)+'%"></i></div></button>'}).join("")+
  '<div class="sub">'+t("hint")+'</div>'}
$("menu").onclick=function(e){var b=e.target.closest(".cat");if(!b)return;sfx.tap();ci=+b.dataset.c;ri=0;runOk=0;loadPhotos(CATS[ci]);start()};
function start(){var r=CATS[ci].r[ri];hide();$("menu").style.display="none";$("game").style.display="flex";
 items=shuffle(r.items);out=[];hist=[];over=false;last=-1;
 var v=items.map(function(x){return x[1]});corr=v.indexOf(r.best==="min"?Math.min.apply(0,v):Math.max.apply(0,v));
 render();scrollTo(0,0)}
function render(){var c=CATS[ci],r=c.r[ri],left=items.length-out.length,qq=L==="ar"?r.qa:r.q;
 $("rn").textContent=c.e+" "+t("round")(n(ri+1),n(c.r.length))+(prog[key(c,r)]?" ★":"");

 $("sub").textContent=edit?t("photo"):over==="win"?t("nailed"):over==="lose"?t("wrong"):(out.length?t("left")(n(left-1)):t("all"));
 $("coins").textContent=n(coins);$("stk").textContent=streak?"🔥 "+n(streak):"";
 $("undo").innerHTML=t("undo")+' <i class="coin"></i>'+n(UNDO);$("undo").disabled=!hist.length||coins<UNDO||over==="win";
 $("skip").textContent=over?t("next"):t("skip");$("cam").className="pill"+(edit?" on":"");
 $("grid").innerHTML=items.map(function(it,i){var o=out.indexOf(i)>-1,cls=o?"out":"";
  if(over==="win"&&!o)cls="win";if(over==="lose"&&i===corr)cls="out bad";
  if(i===last)cls+=" pop";var show=o||over==="win",src=IM[it[0]]||WK[it[0]];
  return '<button class="cell '+cls+(show?" show":"")+'" data-i="'+i+'"><div class="tile" style="background:hsl('+(i*47+20)+',45%,42%)"><span>'+esc(nm(it).replace(/^[("']/,"").charAt(0))+"</span>"+
   (src?'<img src="'+esc(src)+'" alt="" onerror="this.remove()">':"")+'</div><div class="lab">'+esc(show?fmt(r,it[1]):nm(it))+'</div></button>'}).join("")}
$("grid").onclick=function(e){var c=e.target.closest(".cell");if(!c)return;var i=+c.dataset.i,r=CATS[ci].r[ri];
 if(edit){pend=items[i][0];$("file").click();return}
 if(over||out.indexOf(i)>-1)return;
 out.push(i);hist.push(i);last=i;
 if(i===corr){over="lose";lostStreak=streak;streak=0;save();render();shake();sfx.lose();
  var b=[[t("moveOn"),nxt,"y"]];if(coins>=UNDO)b.unshift([t("undoBtn")(n(UNDO)),undo,""]);
  sheet(t("lost"),t("knocked")(nm(items[corr])+" ("+fmt(r,items[corr][1])+")")+(lostStreak>1&&coins>=UNDO?t("keep")(n(lostStreak)):""),b,450)}
 else if(items.length-out.length===1){over="win";var bonus=Math.min(streak,5)*2;streak++;best=Math.max(best,streak);coins+=WIN+bonus;
  runOk++;prog[key(CATS[ci],r)]=1;save();render();sfx.win();confetti();bump();floatTxt("+"+n(WIN+bonus));
  sheet(t("won"),t("coins")(n(WIN))+(bonus?t("bonus")(n(bonus)):"")+(streak>1?t("row")(n(streak)):""),[[t("next"),nxt,"y"]],600)}
 else{render();sfx.elim(out.length)}};
$("file").onchange=function(){var f=this.files[0];this.value="";if(!f||!pend)return;var nmK=pend,u=URL.createObjectURL(f),im=new Image();

  cv.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,220,220);IM[nmK]=cv.toDataURL("image/jpeg",.8);
  if(!sv("elim_img",IM)){delete IM[nmK];alert(t("full"))}URL.revokeObjectURL(u);render()};im.src=u};
$("cam").onclick=function(){if(!inGame())return;edit=!edit;render()};
$("snd").onclick=function(){mute=!mute;save();applyLang();sfx.tap()};
$("lang").onclick=function(){L=L==="ar"?"en":"ar";save();applyLang();sfx.tap();
 if(inGame()&&ri<CATS[ci].r.length){render();hide()}else menu()};
function undo(){if(!hist.length||coins<UNDO||over==="win")return;coins-=UNDO;var i=hist.pop();out.splice(out.indexOf(i),1);last=-1;
 if(over==="lose"){over=false;streak=lostStreak;hide()}save();sfx.tap();bump();floatTxt("−"+n(UNDO));render()}
$("undo").onclick=undo;
function nxt(){if(!over){streak=0;save()}ri++;if(ri>=CATS[ci].r.length)summary();else start()}

  [[t("replay"),function(){ri=0;runOk=0;start()},""],[t("menu"),menu,"y"]],0);if(runOk===k){confetti();sfx.win()}}
