<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eliminate</title>
<style>
:root{--bg:#fafafa;--fg:#1c1c1c;--y:#f7c83d;--dark:#2a2a2a;--mut:#8a8a8a;--g:#3ecf6e;--r:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#161616;--fg:#f2f2f2;--dark:#3a3a3a;--mut:#999}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:800;display:flex;justify-content:center;overflow-x:hidden}
button{cursor:pointer}
#app{width:100%;max-width:440px;padding:14px 16px 120px;display:flex;flex-direction:column;align-items:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top .gap{flex:1}
.pill{border:3px solid var(--fg);border-radius:16px;background:var(--bg);color:var(--fg);font:inherit;font-size:20px;padding:8px 14px;box-shadow:0 5px 0 var(--fg);display:flex;align-items:center;gap:8px}
.pill:active,.btn:active,.cat:active{transform:translateY(3px);box-shadow:0 2px 0 var(--fg)}
.pill.on{background:var(--y);color:#1c1c1c}
.pill.bump{animation:bump .45s}
.coin{width:20px;height:20px;border-radius:50%;background:var(--y);border:3px solid #d9a800;display:inline-block;flex:none}
.meta{width:100%;display:flex;justify-content:space-between;margin-top:16px;font-size:14px;color:var(--mut)}
.streak{color:#f08c00}
.q{text-align:center;margin:12px 0 6px;font-size:18px}
.big{display:inline-block;text-align:center;background:var(--y);color:#1c1c1c;border:4px solid var(--fg);border-radius:18px;padding:12px 22px;font-size:24px;margin:8px 0}
.sub{color:var(--mut);font-size:16px;margin:10px 0 16px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;width:100%}
.grid.shake{animation:shake .45s}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;font:inherit;color:inherit}
.tile{position:relative;width:100%;aspect-ratio:1;border-radius:20px;border:4px solid var(--dark);box-shadow:0 5px 0 var(--dark);display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;overflow:hidden;transition:.15s}
.tile img{width:100%;height:100%;object-fit:cover}
.lab{width:100%;min-height:40px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--dark);color:#fff;border-radius:14px;padding:3px 6px;font-size:12px;line-height:1.1;transition:.15s}
.cell.out .tile{border-color:var(--y);box-shadow:0 5px 0 var(--y)}
.cell.out .tile>*{opacity:.45}
.cell.out .tile::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:58px;color:var(--y);text-shadow:0 3px 0 #0007}
.cell.out .lab{background:var(--y);color:#1c1c1c;font-size:16px}
.cell.win .tile{border-color:var(--g);box-shadow:0 5px 0 var(--g);animation:hop .6s .1s}
.cell.win .lab{background:var(--g);color:#06210f}
.cell.bad .tile{border-color:var(--r);box-shadow:0 5px 0 var(--r)}
.cell.bad .tile::after{color:var(--r)}
.cell.bad .lab{background:var(--r);color:#fff}
.cell.pop .tile{animation:pop .3s}
.cell:active .tile{transform:translateY(3px)}
.cell.show .lab{font-size:16px}
.bar{display:flex;gap:18px;margin-top:26px}
.btn{border:3px solid var(--fg);background:var(--bg);color:var(--fg);font:inherit;font-size:19px;padding:11px 22px;border-radius:999px;box-shadow:0 5px 0 var(--fg);display:flex;gap:8px;align-items:center;justify-content:center}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.y{background:var(--y);color:#1c1c1c}
#menu{width:100%;display:flex;flex-direction:column;gap:14px;align-items:stretch}
#menu h1{text-align:center;font-size:34px;margin:18px 0 0;letter-spacing:1px}
.stats{display:flex;justify-content:center;gap:10px;margin-bottom:4px}
.stat{border:3px solid var(--fg);border-radius:14px;padding:6px 12px;font-size:14px}
.cat{background:var(--y);color:#1c1c1c;border:4px solid var(--fg);border-radius:20px;padding:14px 16px;font:inherit;font-size:20px;box-shadow:0 5px 0 var(--fg);text-align:left}
.cat small{display:flex;justify-content:space-between;font-size:13px;opacity:.75;margin-top:4px}
.pb{height:8px;border-radius:4px;background:#1c1c1c26;margin-top:8px;overflow:hidden}
.pb i{display:block;height:100%;background:#1c1c1c;border-radius:4px}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:4px solid var(--fg);border-radius:26px 26px 0 0;text-align:center;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,1.3,.5,1);font-size:24px}
#sheet.show{transform:none}
#sheet p{margin:6px 0 16px;font-size:16px;color:var(--mut)}
#sheet .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.float{position:fixed;z-index:6;pointer-events:none;font-size:22px;color:#d9a800;text-shadow:0 2px 0 var(--bg);animation:rise 1.1s forwards}
#fx{position:fixed;inset:0;pointer-events:none;z-index:7}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.82)}75%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes hop{0%,100%{transform:none}30%{transform:translateY(-12px) scale(1.06)}60%{transform:translateY(2px)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes bump{0%,100%{transform:none}40%{transform:scale(1.18)}}
@keyframes rise{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-50px)}}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}

function start(){var c=CATS[ci],r=c.r[ri];hide();$("menu").style.display="none";$("game").style.display="flex";
 items=shuffle(r.items);out=[];hist=[];over=false;last=-1;
 var v=items.map(function(x){return x[1]});corr=v.indexOf(r.best==="min"?Math.min.apply(0,v):Math.max.apply(0,v));
 $("rn").textContent=c.e+" ROUND "+(ri+1)+"/"+c.r.length+(prog[key(c,r)]?" ★":"");
 $("q1").textContent=r.q[0];$("q2").textContent=r.q[1];$("q3").textContent=r.q[2];render();scrollTo(0,0)}
function render(){var r=CATS[ci].r[ri],left=items.length-out.length;
 $("sub").textContent=edit?"PHOTO MODE: TAP A TILE":over==="win"?"NAILED IT!":over==="lose"?"WRONG ONE!":(out.length?(left-1)+" TO ELIMINATE":"ELIMINATE ALL BUT ONE");
 $("coins").textContent=coins;$("stk").textContent=streak?"🔥 "+streak:"";
 $("undo").disabled=!hist.length||coins<UNDO||over==="win";$("skip").innerHTML=over?"NEXT ▶":"▶| SKIP";$("cam").className="pill"+(edit?" on":"");
 $("grid").innerHTML=items.map(function(it,i){var o=out.indexOf(i)>-1,cls=o?"out":"";
  if(over==="win"&&!o)cls="win";if(over==="lose"&&i===corr)cls="out bad";
  if(i===last)cls+=" pop";var show=o||over==="win";
  var inner=IM[it[0]]?'<img src="'+IM[it[0]]+'" alt="">':"<span>"+it[0].charAt(0)+"</span>";
  return '<button class="cell '+cls+(show?" show":"")+'" data-i="'+i+'"'+(o||over?" aria-disabled=true":"")+'><div class="tile" style="background:hsl('+(i*47+20)+',45%,42%)">'+inner+'</div><div class="lab">'+(show?fmt(r,it[1]):it[0])+'</div></button>'}).join("")}
$("grid").onclick=function(e){var c=e.target.closest(".cell");if(!c)return;var i=+c.dataset.i,r=CATS[ci].r[ri];
 if(edit){pend=items[i][0];$("file").click();return}
 if(over||out.indexOf(i)>-1)return;
 out.push(i);hist.push(i);last=i;
 if(i===corr){over="lose";lostStreak=streak;streak=0;save();render();shake();sfx.lose();
  var b=[["MOVE ON ▶",nxt,"y"]];if(coins>=UNDO)b.unshift(["↺ UNDO · 30",undo,""]);
  sheet("❌ YOU LOST!","You knocked out the answer: "+items[corr][0]+" ("+fmt(r,items[corr][1])+")."+(lostStreak>1?" Undo to keep your 🔥"+lostStreak+" streak.":""),b,450)}
 else if(items.length-out.length===1){over="win";var bonus=Math.min(streak,5)*2;streak++;best=Math.max(best,streak);coins+=WIN+bonus;
  runOk++;prog[key(CATS[ci],r)]=1;save();render();sfx.win();confetti();bump();floatTxt("+"+(WIN+bonus));
  sheet("🎉 YOU GOT IT!","+"+WIN+" coins"+(bonus?" · +"+bonus+" streak bonus":"")+(streak>1?" · 🔥 "+streak+" in a row":""),[["NEXT ▶",nxt,"y"]],600)}
 else{render();sfx.elim(out.length)}};
$("file").onchange=function(){var f=this.files[0];this.value="";if(!f||!pend)return;var n=pend,u=URL.createObjectURL(f),im=new Image();
 im.onload=function(){var s=Math.min(im.width,im.height),cv=document.createElement("canvas");cv.width=cv.height=220;
  cv.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,220,220);IM[n]=cv.toDataURL("image/jpeg",.8);
  try{localStorage.setItem("elim_img",JSON.stringify(IM))}catch(e){alert("Not enough space on this device to save more photos.")}URL.revokeObjectURL(u);render()};im.src=u};
$("cam").onclick=function(){if($("game").style.display==="none")return;edit=!edit;render()};
$("snd").onclick=function(){mute=!mute;save();$("snd").textContent=mute?"🔇":"🔊";sfx.tap()};
function undo(){if(!hist.length||coins<UNDO||over==="win")return;coins-=UNDO;var i=hist.pop();out.splice(out.indexOf(i),1);last=-1;
 if(over==="lose"){over=false;streak=lostStreak;hide()}save();sfx.tap();bump();floatTxt("−"+UNDO);render()}
$("undo").onclick=undo;
function nxt(){if(!over){streak=0;save()}ri++;if(ri>=CATS[ci].r.length)summary();else start()}
function summary(){var c=CATS[ci],n=c.r.length,s=solved(c);
 sheet(runOk===n?"🏆 PERFECT RUN!":"✅ CATEGORY DONE!","You got "+runOk+"/"+n+" this run · "+(s===n?"★ every round solved":s+"/"+n+" solved overall"),
  [["↻ REPLAY",function(){ri=0;runOk=0;start()},""],["MENU",menu,"y"]],0);if(runOk===n){confetti();sfx.win()}}
$("skip").onclick=function(){sfx.tap();nxt()};$("home").onclick=function(){edit=false;menu()};
function sheet(t,p,btns,d){clearTimeout(stT);$("st").textContent=t;$("sp").textContent=p;var sb=$("sb");sb.innerHTML="";
 btns.forEach(function(b){var e=document.createElement("button");e.className="btn "+b[2];e.textContent=b[0];e.onclick=b[1];sb.appendChild(e)});
 stT=setTimeout(function(){$("sheet").classList.add("show")},d||0)}
function hide(){clearTimeout(stT);$("sheet").classList.remove("show")}
$("snd").textContent=mute?"🔇":"🔊";
menu();
</script></body></html>
