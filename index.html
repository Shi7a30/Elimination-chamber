<style>
:root{--bg:#fafafa;--fg:#1c1c1c;--y:#f7c83d;--dark:#2a2a2a;--mut:#8a8a8a;--g:#3ecf6e;--r:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#f2f2f2;--dark:#3a3a3a;--mut:#999}}
:root[data-theme="dark"]{--bg:#161616;--fg:#f2f2f2;--dark:#3a3a3a;--mut:#999}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:800;display:flex;justify-content:center;overflow-x:hidden}
html[lang=ar] body{font-family:"Cairo",system-ui,-apple-system,"Segoe UI",sans-serif}
button{cursor:pointer}
#app{width:100%;max-width:440px;padding:14px 16px 120px;display:flex;flex-direction:column;align-items:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:7px}
.top .gap{flex:1}
.pill{border:3px solid var(--fg);border-radius:16px;background:var(--bg);color:var(--fg);font:inherit;font-size:19px;min-width:46px;height:46px;padding:0 11px;box-shadow:0 5px 0 var(--fg);display:flex;align-items:center;justify-content:center;gap:8px}
.pill:active,.btn:active,.cat:active{transform:translateY(3px);box-shadow:0 2px 0 var(--fg)}
.pill.on{background:var(--y);color:#1c1c1c}
.pill.bump{animation:bump .45s}
#lang{font-size:16px}
.coin{width:20px;height:20px;border-radius:50%;background:var(--y);border:3px solid #d9a800;display:inline-block;flex:none}
.meta{width:100%;display:flex;justify-content:space-between;margin-top:16px;font-size:14px;color:var(--mut)}
.streak{color:#f08c00}
.q{text-align:center;margin:12px 0 6px;font-size:18px}
.big{display:inline-block;text-align:center;background:var(--y);color:#1c1c1c;border:4px solid var(--fg);border-radius:18px;padding:12px 22px;font-size:24px;margin:8px 0}
.sub{color:var(--mut);font-size:16px;margin:10px 0 16px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;width:100%}
.grid.shake{animation:shake .45s}
.grid.duo{grid-template-columns:1fr 1fr;gap:14px 18px}
.duo .tile{font-size:64px}
.duo .back b{font-size:26px}
.duo .back small{font-size:13px}
.duo .lab{font-size:15px;min-height:48px}
.lab .dt{display:block;font-size:10px;font-weight:600;opacity:.72;margin-top:2px;line-height:1.1}
.duo .lab .dt{font-size:12px}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;font:inherit;color:inherit;min-width:0;perspective:700px}
.card{position:relative;width:100%;aspect-ratio:1;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.cell.flip .card{transform:rotateY(180deg)}
.tile,.back{position:absolute;inset:0;border-radius:20px;border:4px solid var(--dark);box-shadow:0 5px 0 var(--dark);overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.tile{display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff}
.tile img,.back img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;background:#fff}
.back{transform:rotateY(180deg);background:#1c1c1c;color:#fff;border-color:var(--y);box-shadow:0 5px 0 var(--y);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;gap:2px}
.back img{opacity:.28;filter:grayscale(1)}
.back small,.back b,.back i{position:relative}
.back small{font-size:11px;color:var(--y);letter-spacing:.5px;text-transform:uppercase}
.back b{font-size:19px;line-height:1.1;overflow-wrap:anywhere}
.back i{position:absolute;top:4px;inset-inline-end:8px;font-style:normal;font-size:15px;color:var(--y)}
.lab{width:100%;min-height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--dark);color:#fff;border-radius:14px;padding:3px 6px;font-size:12px;line-height:1.15;transition:.15s;overflow-wrap:anywhere}
.cell.out .lab{background:var(--y);color:#1c1c1c}
.cell.out.peek .tile{opacity:.75}
.cell.win{animation:hop .6s .1s}
.cell.win .back{border-color:var(--g);box-shadow:0 5px 0 var(--g)}
.cell.win .back small,.cell.win .back i{color:var(--g)}
.cell.win .lab{background:var(--g);color:#06210f}
.cell.bad .back{border-color:var(--r);box-shadow:0 5px 0 var(--r)}
.cell.bad .back small,.cell.bad .back i{color:var(--r)}
.cell.bad .lab{background:var(--r);color:#fff}
.cell:active .card{translate:0 3px}
.bar{display:flex;gap:18px;margin-top:26px}
.btn{border:3px solid var(--fg);background:var(--bg);color:var(--fg);font:inherit;font-size:19px;padding:11px 22px;border-radius:999px;box-shadow:0 5px 0 var(--fg);display:flex;gap:8px;align-items:center;justify-content:center}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.y{background:var(--y);color:#1c1c1c}
#menu{width:100%;display:flex;flex-direction:column;gap:14px;align-items:stretch}
#menu h1{text-align:center;font-size:34px;margin:18px 0 0;letter-spacing:1px}
.stats{display:flex;justify-content:center;gap:10px;margin-bottom:4px}
.stat{border:3px solid var(--fg);border-radius:14px;padding:6px 12px;font-size:14px}
.cat{background:var(--y);color:#1c1c1c;border:4px solid var(--fg);border-radius:20px;padding:14px 16px;font:inherit;font-size:20px;box-shadow:0 5px 0 var(--fg);text-align:start}
.cat.end{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:flex;border:3px solid var(--fg);border-radius:16px;overflow:hidden;box-shadow:0 4px 0 var(--fg)}
.seg button{flex:1;border:0;background:var(--bg);color:var(--fg);font:inherit;font-size:15px;padding:10px 2px}
.seg button+button{border-inline-start:3px solid var(--fg)}
.seg button.on{background:var(--y);color:#1c1c1c}
.gh{font-size:19px;margin:10px 2px -4px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modes .cat{font-size:17px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;min-height:104px}
.modes .cat small{flex-direction:column;gap:4px}
.cat.grp{min-height:132px}
.subs .cat small{flex-direction:column;gap:2px}
.subs .cat:last-child:nth-child(odd){grid-column:1/-1}
.grp .se{font-size:34px}
.ghead{display:flex;align-items:center;gap:12px;margin-top:14px}
.ghead h2{margin:0;font-size:24px}
.ghead .pill{flex:none}
.dgh{margin:16px 0 0;font-size:17px}
.subs.dsubs{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dsubs .cat.sc{font-size:clamp(11px,3.4vw,14px);overflow-wrap:break-word;padding:10px 6px;line-height:1.2;border-width:3px;border-radius:16px;min-height:0;justify-content:flex-start}
.subs.dsubs .cat:last-child:nth-child(odd){grid-column:auto}
.dsubs .sc .se{display:block;font-size:24px;margin-bottom:4px}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat.sc{font-size:15px;padding:10px 12px 12px;display:flex;flex-direction:column;justify-content:space-between;min-height:118px}
.sc .se{font-size:26px;margin-bottom:4px}
.cat small{display:flex;justify-content:space-between;font-size:13px;opacity:.75;margin-top:4px}
.pb{height:8px;border-radius:4px;background:#1c1c1c26;margin-top:8px;overflow:hidden}
.pb i{display:block;height:100%;background:#1c1c1c;border-radius:4px}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:4px solid var(--fg);border-radius:26px 26px 0 0;text-align:center;transform:translateY(110%);visibility:hidden;transition:transform .3s cubic-bezier(.2,1.3,.5,1),visibility 0s .3s;font-size:24px}
#sheet.show{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,1.3,.5,1)}
#sheet p{margin:6px 0 16px;font-size:16px;color:var(--mut)}
#sheet .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.float{position:fixed;z-index:6;pointer-events:none;font-size:22px;color:#d9a800;text-shadow:0 2px 0 var(--bg);animation:rise 1.1s forwards}
#fx{position:fixed;inset:0;pointer-events:none;z-index:7}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.82)}75%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes hop{0%,100%{transform:none}30%{transform:translateY(-12px) scale(1.06)}60%{transform:translateY(2px)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes bump{0%,100%{transform:none}40%{transform:scale(1.18)}}
@keyframes rise{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-50px)}}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}

function setImg(el,url){var o=el.querySelector("img");if(o)o.remove();var im=new Image();im.alt="";im.onerror=function(){im.remove()};im.src=url;el.insertBefore(im,el.firstChild)}

  var q=d.query||{},map={},pg={};
  (q.normalized||[]).concat(q.redirects||[]).forEach(function(x){map[x.from]=x.to});
  (q.pages||[]).forEach(function(p){pg[p.title]=p});
  need.forEach(function(x){var ti=x.it[3]||x.it[0];ti=map[ti]||ti;ti=map[ti]||ti;var p=pg[ti];
   if(okPage(p))gotPhoto(x.it[0],p.thumbnail.source);else searchPhoto(x)})}).catch(function(){})}
