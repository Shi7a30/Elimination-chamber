name: Fetch photos
on:
  workflow_dispatch:
  push:
    paths: [tools/photo-list.json, tools/fetch_photos.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pillow
      - run: python tools/fetch_photos.py
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tools/photos.json tools/photos-report.json tools/photo-candidates.json
          git diff --cached --quiet || git commit -m "Update fetched photos"
          git push
