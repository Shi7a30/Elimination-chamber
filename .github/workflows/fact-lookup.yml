name: Fact lookup
on:
  workflow_dispatch:
  push:
    paths: [tools/fact_lookup.py, tools/fact-lookup.json]
permissions:
  contents: write
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python -u tools/fact_lookup.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tools/fact-lookup-out.json
          git diff --cached --quiet || git commit -m "Update fact lookup"
          git pull --rebase && git push
